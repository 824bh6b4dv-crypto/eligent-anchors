name: Owner Approval Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  owner-approval:
    name: Owner Approval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Christian approval for contributor PRs
        uses: actions/github-script@v7
        with:
          script: |
            const repoOwner = context.repo.owner;
            const repo = context.repo.repo;
            const approvalAuthority = '824bh6b4dv-crypto';
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed('Unable to resolve pull request from event payload.');
              return;
            }

            if (pr.user?.login === approvalAuthority) {
              core.info(`PR authored by ${approvalAuthority}; no second-human approval required.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: repoOwner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const authorityReviewsOnHead = reviews
              .filter(r => r.user?.login === approvalAuthority && r.commit_id === pr.head.sha)
              .sort((a, b) => new Date(a.submitted_at || 0) - new Date(b.submitted_at || 0));

            const latest = authorityReviewsOnHead.at(-1);
            if (latest?.state === 'APPROVED') {
              core.info(`Contributor PR approved by ${approvalAuthority} on current head ${pr.head.sha}.`);
              return;
            }

            core.setFailed(
              `PRs authored by anyone other than ${approvalAuthority} require an APPROVED review from ${approvalAuthority} on the current head commit before merge.`
            );
