name: Owner Approval Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  owner-approval:
    name: Owner Approval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce owner approval for contributor PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed('Unable to resolve pull request from event payload.');
              return;
            }

            if (pr.user?.login === owner) {
              core.info(`PR authored by repository owner ${owner}; no second-human approval required.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const ownerReviewsOnHead = reviews
              .filter(r => r.user?.login === owner && r.commit_id === pr.head.sha)
              .sort((a, b) => new Date(a.submitted_at || 0) - new Date(b.submitted_at || 0));

            const latest = ownerReviewsOnHead.at(-1);
            if (latest?.state === 'APPROVED') {
              core.info(`Contributor PR approved by ${owner} on current head ${pr.head.sha}.`);
              return;
            }

            core.setFailed(
              `PRs authored by anyone other than ${owner} require an APPROVED review from ${owner} on the current head commit before merge.`
            );
